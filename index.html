<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakar Jirim - Sains Tingkatan 1 Bab 5</title>
    <style>
        :root {
            --primary: #9333ea;
            --primary-dark: #6b21a8;
            --secondary: #c084fc;
            --bg-color: #0f172a;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #16a34a;
            --error: #dc2626;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang tema Sains Makmal / Ungu Neon */
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #581c87 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: var(--border-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(168, 85, 247, 0.2);
            padding: 28px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px dashed #f3e8ff;
            padding-bottom: 16px;
        }

        .header h1 {
            color: var(--primary-dark);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #f3e8ff;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c084fc, #9333ea);
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 18px;
            color: var(--primary-dark);
        }

        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #1e293b;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #faf5ff;
            border: 2px solid #e9d5ff;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
            color: #3b0764;
            font-weight: 500;
        }

        .option-btn:hover:not(:disabled) {
            background: #f3e8ff;
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d !important;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d !important;
        }

        .explanation-box {
            background: #f0fdf4;
            border-left: 5px solid var(--success);
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }

        .explanation-box.wrong-exp {
            background: #fef2f2;
            border-left-color: var(--error);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #7e22ce);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(168, 85, 247, 0.45);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: var(--primary-dark);
            margin-bottom: 12px;
            font-size: 1.6rem;
        }

        .badge {
            font-size: 1.25rem;
            font-weight: bold;
            color: #7e22ce;
            background: #f3e8ff;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin: 16px 0;
            border: 1px solid #e9d5ff;
        }

        .restart-btn {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .quiz-container {
                padding: 20px;
            }
            .question-box {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>🧪
