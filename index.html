<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakar Jirim - Sains Tingkatan 1 Bab 5</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --secondary: #38bdf8;
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --error: #dc2626;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0f2fe;
            padding-bottom: 16px;
        }

        .header h1 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 16px;
            color: var(--text-muted);
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover:not(:disabled) {
            background: #e0f2fe;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #14532d;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #7f1d1d;
        }

        .explanation-box {
            background: #f0fdf4;
            border-left: 4px solid var(--success);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }

        .explanation-box.wrong-exp {
            background: #fef2f2;
            border-left-color: var(--error);
        }

        .action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            display: none;
        }

        .action-btn:hover {
            background: var(--primary-dark);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: var(--primary-dark);
            margin-bottom: 12px;
        }

        .badge {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            background: #e0f2fe;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin: 12px 0;
        }

        .restart-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
        }

        @media (max-width: 480px) {
            .quiz-container {
                padding: 16px;
            }
            .question-box {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>🧪 Pakar Jirim</h1>
        <p>Sains Tingkatan 1 - Bab 5: Jirim</p>
    </div>

    <!-- Screen Quiz -->
    <div id="quiz-screen">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="stats-bar">
            <span id="question-count">Soalan 1/30</span>
            <span id="streak-count">🔥 Streak: 0</span>
        </div>
